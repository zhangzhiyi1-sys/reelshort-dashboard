function softBy(check, locationPart) {

}
function warnchip(check, text) {

// 事件按影响国家过滤：无 ctys 字段=全局事件；有 ctys=仅当与视图国家有交集才显示
function evFor(ctys) {
  return DATA.events.filter(e => !e.ctys || e.ctys.some(c => ctys.includes(c)));
}
function lineChart(el, labels, series, opts = {}) {
  const W = opts.w || 540, H = opts.h || 220, P = {l: 46, r: 14, t: 12, b: 26};
  const all = series.flatMap(s => s.values).filter(v => v != null);
  if (!all.length) { el.innerHTML = '<div class="hint">无数据</div>'; return; }
  let min = Math.min(...all), max = Math.max(...all);
  if (min === max) { min -= 1; max += 1; }
  min = Math.min(0, min); max *= 1.05;
  const x = i => P.l + i * (W - P.l - P.r) / Math.max(labels.length - 1, 1);
  const y = v => P.t + (1 - (v - min) / (max - min)) * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const gv = min + (max - min) * i / 4, gy = y(gv);
    g += `<line x1="${P.l}" y1="${gy}" x2="${W - P.r}" y2="${gy}" stroke="#f0f1f3"/><text x="${P.l - 6}" y="${gy + 4}" font-size="10" fill="#9ca3af" text-anchor="end">${opts.yFmt ? opts.yFmt(gv) : fmt(gv, gv < 10 ? 2 : 0)}</text>`;
  }
  labels.forEach((l, i) => {
    if (i % Math.ceil(labels.length / 8) === 0)
      g += `<text x="${x(i)}" y="${H - 8}" font-size="10" fill="#9ca3af" text-anchor="middle">${opts.rawLabels ? l : l.slice(5)}</text>`;
  });
  const evPlaced = [];
  (opts.events || []).forEach(ev => {
    const i = labels.indexOf(ev.d);
    if (i < 0) return;
    const ex = x(i), tw = ev.t.length * 9.5;
    let lv = 0;
    while (evPlaced.some(p => p.lv === lv && ex < p.x + p.w + 6)) lv++;
    evPlaced.push({ lv, x: ex, w: tw });
    g += `<line x1="${ex}" y1="${P.t}" x2="${ex}" y2="${H - P.b}" stroke="#f59e0b" stroke-dasharray="4 3" stroke-width="1.2"/><text x="${ex + 3}" y="${P.t + 10 + lv * 11}" font-size="9" fill="#d97706">${ev.t}</text>`;
  });
  series.forEach(s => {
    const pts = s.values.map((v, i) => v == null ? null : `${x(i)},${y(v)}`).filter(Boolean);
    if (pts.length > 1) g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" ${s.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// ---------- SVG 横向条形(占比+绝对量双图用) ----------
function hbars(el, items, opts = {}) {
  // items: [{label, v1, v2}] 两组对比条
  const W = opts.w || 540, rowH = 26, H = items.length * rowH + 30, P = {l: 90, r: 60};
  const max = Math.max(...items.flatMap(i => [i.v1, i.v2]), 0.001);
  const bw = v => (v / max) * (W - P.l - P.r);
  let g = '';
  items.forEach((it, i) => {
    const y0 = i * rowH + 8;
    g += `<text x="${P.l - 6}" y="${y0 + 12}" font-size="11" fill="#4b5563" text-anchor="end">${it.label}</text>`;
    g += `<rect x="${P.l}" y="${y0}" width="${bw(it.v1)}" height="9" rx="2" fill="#94a3b8"/>`;
    g += `<rect x="${P.l}" y="${y0 + 11}" width="${bw(it.v2)}" height="9" rx="2" fill="#2563eb"/>`;
    g += `<text x="${P.l + bw(it.v1) + 4}" y="${y0 + 8}" font-size="10" fill="#94a3b8">${opts.fmt ? opts.fmt(it.v1) : fmt(it.v1)}</text>`;
    g += `<text x="${P.l + bw(it.v2) + 4}" y="${y0 + 19}" font-size="10" fill="#2563eb">${opts.fmt ? opts.fmt(it.v2) : fmt(it.v2)}</text>`;
  });
  g += `<rect x="${P.l}" y="${H - 16}" width="10" height="8" fill="#94a3b8" rx="2"/><text x="${P.l + 14}" y="${H - 9}" font-size="10" fill="#6b7280">${opts.l1 || '一期'}</text>`;
  g += `<rect x="${P.l + 60}" y="${H - 16}" width="10" height="8" fill="#2563eb" rx="2"/><text x="${P.l + 74}" y="${H - 9}" font-size="10" fill="#6b7280">${opts.l2 || '二期'}</text>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

    .sort((a, b) => b.iap2 - a.iap2);
}
function layerTable(pt) {
  const rows = layerRows(pt);
  const hasWin = rows.some(r => r.win2);
  let tr = `<thead><tr><th>国家</th>${hasWin ? '<th>后窗</th>' : ''}<th>DAU 前→后</th><th>付费率% 前→后</th><th>Δpp</th><th>订阅率% 前→后</th><th>下单率% 前→后</th><th>付费uv 前→后</th><th>ARPPU 前→后</th><th>ARPU 前→后</th><th>日均IAP$ 前→后</th><th>IAP变化</th><th>LTV1 前→后</th><th>LTV7 前→后</th></tr></thead><tbody>`;
  rows.forEach(r => {
    const dpp = (r.rate1 != null && r.rate2 != null) ? r.rate2 - r.rate1 : null;
    const iapChg = (r.iap1 && r.iap2 != null) ? (r.iap2 / r.iap1 - 1) * 100 : null;
    const ltvCell = (a, b) => (a != null && b != null) ? `$${fmt(a, 3)}→$${fmt(b, 3)}` : (a != null ? `$${fmt(a, 3)}→<span class="flat">未成熟</span>` : '-');
    tr += `<tr style="cursor:default"><td>${r.c}</td>
      ${hasWin ? `<td style="font-size:11px;color:var(--fg-tertiary)">${r.win2 || ''}</td>` : ''}
      <td>${fmt(r.dau1)}→${fmt(r.dau2)}</td>
      <td>${fmt(r.rate1, 3)}→${fmt(r.rate2, 3)}</td>
      <td class="${cls(dpp)}">${pp(dpp)}</td>
      <td>${fmt(r.subr1, 3)}→${fmt(r.subr2, 3)}</td>
      ${orateTd(r)}
      <td>${fmt(r.pay1, 1)}→${fmt(r.pay2, 1)}</td>
      <td>$${fmt(r.arppu1, 1)}→$${fmt(r.arppu2, 1)}</td>
      ${arpuTd(r)}
      <td>$${fmt(r.iap1)}→$${fmt(r.iap2)}</td>
      <td class="${cls(iapChg)}">${pct(iapChg, 0)}</td>
      <td>${ltvCell(r.ltv1_1, r.ltv1_2)}</td>
      <td>${ltvCell(r.ltv7_1, r.ltv7_2)}</td></tr>`;
  });
  return tr + '</tbody>';
}
function layerBullets(pt) {
  const rows = layerRows(pt);
  const chg = r => (r.iap2 / r.iap1 - 1) * 100;
  const up = rows.filter(r => chg(r) > 0).sort((a, b) => chg(b) - chg(a));
  const down = rows.filter(r => chg(r) <= 0).sort((a, b) => chg(a) - chg(b));
  const fmtC = r => `${r.c} ${chg(r) > 0 ? '+' : ''}${chg(r).toFixed(0)}%`;
  const b = [];
  b.push(`<b>IAP 日均</b>：上涨 ${up.length}/${rows.length} 国` + (up.length ? `——${up.map(fmtC).join('、')}` : ''));
  if (down.length) b.push(`<b>下滑国家</b>：${down.map(r => `${r.c} ${chg(r).toFixed(0)}%（付费率 ${pp(r.rate2 - r.rate1)}）`).join('、')}`);
  const hot = rows.filter(r => r.pay1 > 0 && r.pay2 / r.pay1 >= 1.5).sort((a, b) => b.pay2 / b.pay1 - a.pay2 / a.pay1);
  if (hot.length) b.push(`<b>付费uv大幅改善</b>：${hot.map(r => `${r.c} ${fmt(r.pay1, 1)}→${fmt(r.pay2, 1)}（×${(r.pay2 / r.pay1).toFixed(1)}）`).join('、')}`);
  const ltvBad = rows.filter(r => r.ltv7_1 && r.ltv7_2 && r.ltv7_2 / r.ltv7_1 < 0.9);
  if (ltvBad.length) b.push(`<b>LTV7 恶化&gt;10%</b>：${ltvBad.map(r => `${r.c} ${(r.ltv7_2 / r.ltv7_1 * 100 - 100).toFixed(0)}%`).join('、')}——放量是否透支需关注`);
  return b.map(x => `<div>${x}</div>`).join('');
}

  </div>
  <div class="card footer-note">
    判定矩阵：充值日均↑+率↑+LTV不恶化=真改善｜量↑率↓=放量稀释｜量平率↓=放量未转化｜量率齐↓=策略变差｜率↑LTV恶化=透支型｜样本&lt;30单=样本小·观察。<br>
    注意：基线为一期命名策略（7.01-7.16 段，SEO 表窗口起点），未匹配货架流量未归入任何策略——其影响见详情页「数据健康」层。
  </div>`;
}

// ---------- 详情页 ----------
function showDetail(name) {
  if (HARD.length) return;
  const s = DATA.strategies.find(x => x.name === name);
  if (!s) return;
  navTo(null);
  $('#stratSel').value = name;
  const det = DATA.details[name], d = s.detail || {};
  const ser = det.series, labels = ser.map(r => r.d);
  const isNew = s.base !== null;
  const cf = det.ctyFunnel || [];
  const fw = DATA.meta.fw || { n1: 16, n2: 24, p1: ['2026-07-01', '2026-07-16'], p2: ['2026-07-17', '2026-08-09'] };
  const topC = cf.length ? cf.reduce((m, x) => (x.ow || 0) > (m.ow || 0) ? x : m, cf[0]) : null;
  curSkuPt = name.includes('已付费') ? '已付费用户' : '未付费用户';
  curSkuCty = '全部';

  // 量率图
  const rate7 = ser.map((r, i) => {
    const win = ser.slice(Math.max(0, i - 6), i + 1);
    let e = 0, p = 0; win.forEach(w => { e += w.exp; p += w.pay; });
    return e > 0 ? p / e * 100 : null;
  });

  // 漏斗（按国家）：曝光窗口径 一期7.1~7.16(前身同人群) vs 二期7.17~；量按日均、率=窗口总量比
  const fr = (a, b) => a > 0 ? (b / a * 100).toFixed(2) + '%' : '-';
  const funnelBlock = (t, e, o, p, n) => `
    <div style="margin:6px 0">
      <div style="font-size:11px;color:#6b7280">${t}</div>
      <div style="display:flex;align-items:baseline;gap:8px;font-size:13px;margin-top:3px;white-space:nowrap">
        <span>曝光 <b>${fmt(e / n)}</b></span><span class="frate" style="font-size:12px">→ ${fr(e, o)}</span>
        <span>建单 <b>${fmt(o / n)}</b></span><span class="frate" style="font-size:12px">→ ${fr(o, p)}</span>
        <span>充值 <b>${fmt(p / n)}</b></span>
      </div></div>`;
  let funnelHtml;
  const bsLabel = isNew ? '一期（前身老策略·同人群）' : '一期';
  const evLabel = isNew ? '二期（本策略）' : '二期（已下线·残留）';
  // 分国IAP三因子（日均口径, LMDI）
  const iapLine = t => !t ? '' : `<div style="font-size:12px;margin-top:5px;border-top:1px dashed #eef0f2;padding-top:5px">
    IAP日均 <b>$${fmt(t.R1, 1)} → $${fmt(t.R2, 1)}</b>（<span class="${cls(t.dR)}">${$d(t.dR)}</span>）：
    曝光 <span class="${cls(t.cE)}">${$d(t.cE)}</span>｜率 <span class="${cls(t.cR)}">${$d(t.cR)}</span>｜ARPPU <span class="${cls(t.cA)}">${$d(t.cA)}</span></div>`;
  cf.forEach(x => { x.iap = iapLmdi(x.e1 / fw.n1, x.p1 / fw.n1, (x.r1 || 0) / fw.n1, x.e2 / fw.n2, x.p2 / fw.n2, x.r2 / fw.n2); });
  if (cf.length) {
    const tot = cf.reduce((a, x) => ({ e1: a.e1 + x.e1, o1: a.o1 + x.o1, p1: a.p1 + x.p1, r1: a.r1 + (x.r1 || 0), e2: a.e2 + x.e2, o2: a.o2 + x.o2, p2: a.p2 + x.p2, r2: a.r2 + x.r2 }),
      { e1: 0, o1: 0, p1: 0, r1: 0, e2: 0, o2: 0, p2: 0, r2: 0 });
    const totIap = iapLmdi(tot.e1 / fw.n1, tot.p1 / fw.n1, tot.r1 / fw.n1, tot.e2 / fw.n2, tot.p2 / fw.n2, tot.r2 / fw.n2);
    funnelHtml = (cf.length > 1 ? `<div style="border:2px solid #dbe3ef;border-radius:8px;padding:10px 14px">
      <div style="font-weight:700;margin-bottom:4px">汇总</div>
      ${funnelBlock(bsLabel, tot.e1, tot.o1, tot.p1, fw.n1)}
      ${funnelBlock(evLabel, tot.e2, tot.o2, tot.p2, fw.n2)}
      ${iapLine(totIap)}</div>` : '')
      + cf.map(x => `<div style="border:1px solid #eef0f2;border-radius:8px;padding:10px 14px">
      <div style="font-weight:700;margin-bottom:4px">${x.c} ${x.v !== '—' ? `<span class="vchip v-${x.v}" style="font-size:11px;padding:1px 8px">${x.v}</span>` : ''}</div>
      ${funnelBlock(bsLabel, x.e1, x.o1, x.p1, fw.n1)}
      ${funnelBlock(evLabel, x.e2, x.o2, x.p2, fw.n2)}
      ${iapLine(x.iap)}</div>`).join('');
    // 软预警: 该策略覆盖国家的漏斗异常
    const fWarns = softBy('FUNNEL_OUT_OF_RANGE', '').filter(w => s.ctys.some(c => w.location.startsWith(c)));
    if (fWarns.length) {
      funnelHtml += '<div class="warnbox">⚠ 漏斗段超出100%: ' + fWarns.map(w => w.location.split(' ')[0] + ':' + w.message.replace(/^漏斗段超出100%: /, '')).join('；') + '（充值率因续订豁免）</div>';
    }
  } else {
    const f = det.funnel;
    funnelHtml = ['p1', 'p2'].map(p => `
    <div style="flex:1"><div style="font-weight:700;margin-bottom:6px">${p === 'p1' ? '一期' : '二期'}</div>
    <div class="funnel-row"><div class="fblock"><div class="fv">${fmt(f[p].exp)}</div><div class="fk">曝光uv</div></div>
    <span class="frate">${fr(f[p].exp, f[p].order)}</span>
    <div class="fblock"><div class="fv">${fmt(f[p].order)}</div><div class="fk">建单uv</div></div>
    <span class="frate">${fr(f[p].order, f[p].pay)}</span>
    <div class="fblock"><div class="fv">${fmt(f[p].pay)}</div><div class="fk">充值uv</div></div></div></div>`).join('');
  }

  // 结构效应 vs 组内效应（辛普森悖论检验，曝光→充值率，曝光窗口径）
  const sh = det.shift;
  let shiftHtml = '';
  if (sh && cf.length > 1) {
    let driver;
    if (Math.abs(sh.struct) < Math.abs(sh.delta) * 0.15) driver = '结构效应≈0 → 整体率变化是各国自身的真实变化，可归因为策略效果，非流量结构假象。';
    else if (Math.abs(sh.struct) > Math.abs(sh.within)) driver = '结构效应主导 → 整体率变化主要由国家间流量再分配驱动，不能直接归因策略本身，先看各国组内表现。';
    else driver = '组内与结构同向叠加 → 策略自身变化与流量结构变化各占一部分，两者都需关注。';
    shiftHtml = `<div class="card"><h2>④b 整体率变化拆解：组内 vs 结构</h2>
    <div class="hint">曝光→充值率 ${fmt(sh.r1, 2)}% → ${fmt(sh.r2, 2)}%（${pp(sh.delta)}）= 组内效应（各国自身率变化，按一期权重）+ 结构效应（流量在国家间再分配）+ 交互项</div>
    <div class="grid4" style="margin-top:8px">
      <div class="kpi"><div class="k">整体变化</div><div class="v ${cls(sh.delta)}">${pp(sh.delta)}</div></div>
      <div class="kpi"><div class="k">组内效应</div><div class="v ${cls(sh.within)}">${pp(sh.within)}</div></div>
      <div class="kpi"><div class="k">结构效应</div><div class="v ${cls(sh.struct)}">${pp(sh.struct)}</div></div>
      <div class="kpi"><div class="k">交互项</div><div class="v ${cls(sh.inter)}">${pp(sh.inter)}</div></div>
    </div>
    <div class="hint" style="margin-top:8px">→ ${driver}</div></div>`;
  }

  // 人群表
  const segRows = {};
  det.seg.forEach(r => { segRows[r.ut + '|' + r.pt] = segRows[r.ut + '|' + r.pt] || {}; segRows[r.ut + '|' + r.pt][r.p] = r; });
  let segTr = '';
  Object.keys(segRows).sort().forEach(k => {
    const [ut, pt] = k.split('|'), g = segRows[k], a = g.p1, b = g.p2;
    const sr = x => x && x.o > 0 ? (x.pay / x.o * 100).toFixed(1) + '%' : '-';
    segTr += `<tr style="cursor:default"><td>${ut}</td><td>${pt.replace('用户', '')}</td>
      <td>${a ? fmt(a.o) : '-'}</td><td>${b ? fmt(b.o) : '-'}</td>
      <td>${a ? fmt(a.pay) : '-'}</td><td>${b ? fmt(b.pay) : '-'}</td>
      <td>${sr(a)}</td><td>${sr(b)}</td>
      <td>${b ? fmt(b.rev, 0) : '-'}</td></tr>`;
  });

  // 国家表（优先用曝光窗口径的ctyFunnel：含曝光与两段率；无则回退老支付表口径）
  let ctyTr = '', ctyHead = '';
  if (cf.length) {
    ctyHead = `<tr><th>国家</th><th>曝光日均·一期</th><th>曝光日均·二期</th><th>曝→建率·一期</th><th>曝→建率·二期</th><th>建→充率·一期</th><th>建→充率·二期</th><th>充值日均·一期</th><th>充值日均·二期</th><th>收入·二期$</th><th>判定</th><th>建单权重</th></tr>`;
    cf.forEach(x => {
      const dchg = (a, b) => a > 0 ? pct((b / a - 1) * 100) : '-';
      const e1d = x.e1 / fw.n1, e2d = x.e2 / fw.n2, p1d = x.p1 / fw.n1, p2d = x.p2 / fw.n2;
      ctyTr += `<tr onclick="showCtyDaily('${name}','${x.c}')" title="点击查看 ${x.c} 日趋势">
      <td>${x.c}</td>
      <td>${fmt(e1d)}</td><td>${fmt(e2d)} <small class="${cls(e1d ? (e2d / e1d - 1) * 100 : 0)}">${dchg(e1d, e2d)}</small></td>
      <td>${fmt(x.or1, 2)}%</td><td>${fmt(x.or2, 2)}% <small class="${cls(x.or2 - x.or1)}">${pp(x.or2 - x.or1)}</small></td>
      <td>${fmt(x.sr1, 1)}%</td><td>${fmt(x.sr2, 1)}% <small class="${cls(x.sr2 - x.sr1)}">${pp(x.sr2 - x.sr1)}</small></td>
      <td>${fmt(p1d, 1)}</td><td>${fmt(p2d, 1)} <small class="${cls(p1d ? (p2d / p1d - 1) * 100 : 0)}">${dchg(p1d, p2d)}</small></td>
      <td>${fmt(x.r2, 0)}</td>
      <td>${x.v !== '—' ? `<span class="vchip v-${x.v}" style="font-size:11px;padding:1px 8px">${x.v}</span>` : '—'}</td>
      <td>${x.ow}%</td></tr>`;
    });
  } else {
    ctyHead = `<tr><th>国家</th><th>建单·一期</th><th>建单·二期</th><th>充值·一期</th><th>充值·二期</th><th>成功率·一期</th><th>成功率·二期</th><th>收入·二期$</th></tr>`;
    const cg = {};
    det.cty.forEach(r => { cg[r.c] = cg[r.c] || {}; cg[r.c][r.p] = r; });
    Object.keys(cg).forEach(c => {
      const a = cg[c].p1, b = cg[c].p2;
      const sr = x => x && x.o > 0 ? (x.pay / x.o * 100).toFixed(1) + '%' : '-';
      const chg = (a && b && a.pay > 0) ? pct((b.pay / a.pay - 1) * 100) : '-';
      ctyTr += `<tr style="cursor:default"><td>${c}</td><td>${a ? fmt(a.o) : '-'}</td><td>${b ? fmt(b.o) : '-'}</td>
      <td>${a ? fmt(a.pay) : '-'}</td><td>${b ? fmt(b.pay, 1) + ' <small>' + chg + '</small>' : '-'}</td>
      <td>${sr(a)}</td><td>${sr(b)}</td><td>${b ? fmt(b.rev, 0) : '-'}</td></tr>`;
    });
  }

  // LTV
  const ltvRows = DATA.ltv.filter(r => s.ctys.includes(r.c));
  const lg = {};
  ltvRows.forEach(r => { lg[r.c] = lg[r.c] || {}; lg[r.c][r.p] = r; });
  let ltvTr = '';
  Object.keys(lg).forEach(c => {
    const a = lg[c].p1, b = lg[c].p2;
    if (!a || !b) return;
    const c1 = (b.ltv1 / a.ltv1 - 1) * 100, c7 = (b.ltv7 / a.ltv7 - 1) * 100;
    const ltvLowChip = (b.ltv7 < b.ltv1 * 0.5) ? warnchip('LTV7低', 'LTV7远低于LTV1，窗口可能截断') : '';
    ltvTr += `<tr style="cursor:default"><td>${c}${ltvLowChip}</td><td>$${fmt(a.ltv1, 3)}</td><td>$${fmt(b.ltv1, 3)} <small class="${cls(c1)}">(${pct(c1, 0)})</small></td>
      <td>$${fmt(a.ltv7, 3)}</td><td>$${fmt(b.ltv7, 3)} <small class="${cls(c7)}">(${pct(c7, 0)})</small></td>
      <td>${c7 < c1 - 5 ? '<span class="down">⚠ LTV7恶化更深·领先预警</span>' : '<span class="flat">正常</span>'}</td></tr>`;
  });

  // 健康: 拐点 = 二期充值uv最大单日变化
  let turn = '-';
  const p2s = ser.filter(r => r.d >= '2026-07-17' && r.exp > 0);
  if (p2s.length > 1) {
    let mx = 0;
    for (let i = 1; i < p2s.length; i++) {
      const ch = Math.abs(p2s[i].pay - p2s[i - 1].pay);
      if (ch > mx) { mx = ch; turn = p2s[i].d; }
    }
  }

  $('#app').innerHTML = `
  <div class="card"><h2>① 策略信息</h2>
    <div class="info-grid">
      <div><span class="ik">策略名称：</span>${s.name}</div>
      <div><span class="ik">类型：</span>${s.type}</div>
      <div><span class="ik">上线时间：</span>${s.first}</div>
      <div><span class="ik">覆盖国家：</span>${s.ctys.join(' / ')}</div>
      <div><span class="ik">对照基线：</span>${s.base || '—'}</div>
      <div><span class="ik">策略目标：</span>${s.target}</div>
    </div></div>

  <div class="card"><h2>② 效果判定卡</h2><div class="hint">${d.reason || '二期（日均）vs 一期前身同人群（日均）'}</div>
    <div class="verdict-hero">
      <div class="big v-${s.verdict}">${s.verdict}</div>
      <div class="advice">${ADVICE[s.verdict] || ''}</div>
    </div>
    ${isNew && d.ev ? `<div class="grid4" style="margin-top:14px">
      <div class="kpi"><div class="k">单曝光收入</div><div class="v">$${fmt(d.rpe_bs, 4)}<small>→</small>$${fmt(d.rpe_ev, 4)} <span class="${cls(d.rpe_chg)}">${pct(d.rpe_chg)}</span></div></div>
      <div class="kpi"><div class="k">曝光→充值率</div><div class="v">${fmt(d.rate_bs, 2)}%<small>→</small>${fmt(d.rate_ev, 2)}% <span class="${cls(d.rate_pp)}">${pp(d.rate_pp)}</span></div></div>
      <div class="kpi"><div class="k">充值uv日均</div><div class="v">${fmt(d.bs.pay, 1)}<small>→</small>${fmt(d.ev.pay, 1)} <span class="${cls(d.pay_chg)}">${pct(d.pay_chg)}</span></div></div>
      <div class="kpi"><div class="k">LTV1 / LTV7（覆盖国家）</div><div class="v"><span class="${cls(d.ltv.ltv1_chg)}">${pct(d.ltv.ltv1_chg, 0)}</span><small>/</small><span class="${cls(d.ltv.ltv7_chg)}">${pct(d.ltv.ltv7_chg, 0)}</span></div></div>
    </div>` : ''}
    ${isNew && d.iap3 ? `<div class="box-hl" style="margin-top:12px;border-radius:8px;padding:10px 14px;font-size:13px">
      <b>IAP 三因子拆解</b>（日均充值收入 $${fmt(d.iap3.rev_bs, 1)} → $${fmt(d.iap3.rev_ev, 1)}，<span class="${cls(d.iap3.rev_ev - d.iap3.rev_bs)}">${d.iap3.rev_ev - d.iap3.rev_bs > 0 ? '+' : ''}$${fmt(d.iap3.rev_ev - d.iap3.rev_bs, 1)}</span>）：
      曝光 <span class="${cls(d.iap3.c_e)}">${d.iap3.c_e > 0 ? '+' : ''}$${fmt(d.iap3.c_e, 1)}</span>（量 ${pct(d.iap3.e_chg, 0)}）｜
      曝光→充值率 <span class="${cls(d.iap3.c_r)}">${d.iap3.c_r > 0 ? '+' : ''}$${fmt(d.iap3.c_r, 1)}</span>（${pp(d.rate_pp)}）｜
      ARPPU <span class="${cls(d.iap3.c_a)}">${d.iap3.c_a > 0 ? '+' : ''}$${fmt(d.iap3.c_a, 1)}</span>（${pct(d.iap3.a_chg, 0)}）
      <div class="hint" style="margin-top:4px">LMDI 对数分解，三因子贡献精确加总 = 收入总变化；ARPPU 贡献为负且占比大 → 去⑦SKU看低价档占比变化</div>
    </div>` : ''}
    ${isNew && cf.length ? `<div style="margin-top:14px;border-top:1px dashed #e5e7eb;padding-top:10px">
      <div class="hint">分国家判定（曝光窗口径：一期 ${fw.p1[0].slice(5)}~${fw.p1[1].slice(5)} vs 二期 ${fw.p2[0].slice(5)}~${fw.p2[1].slice(5)}，基线=一期前身同人群；与上方汇总判定窗口不同）</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${cf.map(x => `<span class="vchip v-${x.v}">${x.c}·${x.v}<small>建单占比${x.ow}%</small></span>`).join('')}</div>
      ${cf.length > 1 && topC && topC.ow >= 40 ? `<div class="hint" style="margin-top:6px">⚠ 汇总判定「${s.verdict}」受 ${topC.c} 主导（二期建单占比 ${topC.ow}%），其他国家表现可能相反——以分国判定为准</div>` : ''}
    </div>` : ''}
  </div>

  <div class="grid2">
    <div class="card"><h2>③a 量：曝光与充值</h2><div class="hint">曝光是运营的旋钮，先看绝对充值uv有没有跟上</div>
      <div class="legend"><span><i style="background:#94a3b8"></i>曝光uv</span><span><i style="background:#2563eb"></i>充值uv</span></div>
      <div id="chVol"></div></div>
    <div class="card"><h2>③b 率：曝光→充值率（7日均线）</h2><div class="hint">率才是策略质量；率量方向矛盾 → 警惕放量稀释</div>
      <div class="legend"><span><i style="background:#16a34a"></i>曝光→充值率(7d MA)</span></div>
      <div id="chRate"></div></div>
  </div>

  <div class="card"><h2>④ 漏斗拆解（按国家）</h2><div class="hint">曝光窗口径：一期 ${fw.p1[0].slice(5)}~${fw.p1[1].slice(5)}（${fw.n1}天，前身老策略同人群）vs 二期 ${fw.p2[0].slice(5)}~${fw.p2[1].slice(5)}（${fw.n2}天，本策略）；量=日均、率=窗口总量比。曝光→建单跌 = 货架/展示/价格锚点问题；建单→充值跌 = 支付/价格敏感问题（建单来自支付表按货架归集）</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px">${funnelHtml}</div></div>

  ${shiftHtml}

let curSkuPt = '全部', curSkuCty = '全部';
function setSkuPt(pt) { curSkuPt = pt; renderSku($('#stratSel').value); }
function setSkuCty(c) { curSkuCty = c; renderSku($('#stratSel').value); }
function renderSku(name) {
  const s = DATA.strategies.find(x => x.name === name);
  $('#ptA').classList.toggle('on', curSkuPt === '全部');
  $('#ptU').classList.toggle('on', curSkuPt === '未付费用户');
  $('#ptP').classList.toggle('on', curSkuPt === '已付费用户');
  // 韩泰不属于11国分盘策略，但有独立档位支付明细；加入按钮供单独查看，不混入当前策略的“全部”汇总
  const skuCtys = [...new Set([...s.ctys, ...REFCTYS.filter(c => DATA.sku.some(r => r.c === c))])];
  $('#skuCtyT').innerHTML = ['全部', ...skuCtys].map(c =>
    `<button class="${curSkuCty === c ? 'on' : ''}" onclick="setSkuCty('${c}')">${c}</button>`).join('');
  const selectedCtys = REFCTYS.includes(curSkuCty) ? [curSkuCty] : s.ctys;
  const rows = DATA.sku.filter(r => selectedCtys.includes(r.c) && r.pt === curSkuPt && (curSkuCty === '全部' || r.c === curSkuCty));
  const g = {};
  rows.forEach(r => {
    const k = r.ot + '|' + r.price;
    g[k] = g[k] || { ot: r.ot, price: r.price, p1: 0, p2: 0 };
    if (r.p === 'p1' || r.p === 'p2') g[k][r.p] += r.uv;
  });
  const items = Object.values(g).sort((a, b) => (a.ot > b.ot ? 1 : -1) || a.price - b.price);
  const t1 = items.reduce((s, i) => s + i.p1, 0), t2 = items.reduce((s, i) => s + i.p2, 0);
  hbars($('#skuShare'), items.map(i => ({ label: (i.ot === '金币' ? '金币$' : '订阅$') + i.price, v1: t1 ? i.p1 / t1 * 100 : 0, v2: t2 ? i.p2 / t2 * 100 : 0 })), { fmt: v => v.toFixed(1) + '%' });
  hbars($('#skuAbs'), items.map(i => ({ label: (i.ot === '金币' ? '金币$' : '订阅$') + i.price, v1: i.p1, v2: i.p2 })));
}

function arpuTd(r) {
  const chg = (r.arpu1 && r.arpu2 != null) ? (r.arpu2 / r.arpu1 - 1) * 100 : null;
  const a = r.arpu1 != null ? '$' + fmt(r.arpu1, 3) : '—';
  const b = r.arpu2 != null ? '$' + fmt(r.arpu2, 3) : '—';
  return `<td>${a}→${b}${chg != null ? `<br><span class="${cls(chg)}" style="font-size:11px">${pct(chg, 0)}</span>` : ''}</td>`;
}
// 下单率 = 建单/DAU（≠漏斗的建单/触达），Δ 用 pp（9.2 起，复盘主指标）
function orateTd(r) {
  const d = (r.orate1 != null && r.orate2 != null) ? r.orate2 - r.orate1 : null;
  const a = r.orate1 != null ? fmt(r.orate1, 2) + '%' : '—';
  const b = r.orate2 != null ? fmt(r.orate2, 2) + '%' : '—';
  return `<td>${a}→${b}${d != null ? `<br><span class="${cls(d)}" style="font-size:11px">${pp(d)}</span>` : ''}</td>`;
}
function renderCtyMain() {

  let tr = '<thead><tr><th>国家</th><th>DAU日均 前→后</th><th>付费率 前→后</th><th>Δpp</th><th>订阅率 前→后</th><th>下单率 前→后</th><th>ARPPU 前→后</th><th>ARPU 前→后</th><th>IAP日均 前→后</th><th>IAP变化</th></tr></thead><tbody>';
  rows.forEach(r => {
    const dpp = (r.rate2 != null && r.rate1 != null) ? r.rate2 - r.rate1 : null;
    const iapChg = (r.iap1 && r.iap2 != null) ? (r.iap2 / r.iap1 - 1) * 100 : null;
    tr += `<tr style="cursor:default"><td>${r.c}</td>
      <td>${fmt(r.dau1)}→${fmt(r.dau2)}</td>
      <td>${fmt(r.rate1, 3)}%→${fmt(r.rate2, 3)}%</td>

      <td>${fmt(r.subr1, 3)}%→${fmt(r.subr2, 3)}%</td>
      ${orateTd(r)}
      <td>$${fmt(r.arppu1, 1)}→$${fmt(r.arppu2, 1)}</td>
      ${arpuTd(r)}
      <td>$${fmt(r.iap1)}→$${fmt(r.iap2)}</td>
      <td class="${cls(iapChg)}">${pct(iapChg, 0)}</td></tr>`;
  });
  $('#ctyTable').innerHTML = tr + '</tbody>';
  // 核心判断（全站 11 国合计，静态两期对比）
  const cr = DATA.core || [];
  if (cr.length === 2) {
    const [c1, c2] = cr;
    const ccell = (v1, v2, pre, suf, dec) => {
      const chg = (v1 && v2 != null) ? (v2 / v1 - 1) * 100 : null;
      return `<td>${pre}${fmt(v1, dec)}${suf}</td><td>${pre}${fmt(v2, dec)}${suf}<br><span class="${cls(chg)}" style="font-size:11px">${chg != null ? pct(chg, 0) : ''}</span></td>`;
    };
    $('#coreTable').innerHTML = `<thead><tr><th>指标（全站）</th><th>一期（${DATA.meta.p1[0].slice(5)}~${DATA.meta.p1[1].slice(5)}）</th><th>二期至今（${DATA.meta.p2[0].slice(5)}~${DATA.meta.p2[1].slice(5)}）</th></tr></thead><tbody>
      <tr style="cursor:default"><td>ARPU（收入/DAU）</td>${ccell(c1.arpu, c2.arpu, '$', '', 4)}</tr>
      <tr style="cursor:default"><td>下单率（建单/DAU）</td>${ccell(c1.orate, c2.orate, '', '%', 2)}</tr>
      <tr style="cursor:default"><td>单新增付费产出（收入/新增付费uv）</td>${ccell(c1.npp, c2.npp, '$', '', 2)}</tr></tbody>`;
    const arpuChg = (c2.arpu / c1.arpu - 1) * 100, orChg = (c2.orate / c1.orate - 1) * 100, nppChg = (c2.npp / c1.npp - 1) * 100;
    $('#coreNote').innerHTML = `二期 vs 一期：ARPU <b class="${cls(arpuChg)}">${pct(arpuChg, 0)}</b>、下单率 <b class="${cls(orChg)}">${pct(orChg, 0)}</b>、单新增付费产出 <b class="${cls(nppChg)}">${pct(nppChg, 0)}</b>`;
  }
  // 分人群诊断（二期 vs 一期）
  const diagOf = r => {
    const o = (r.orate1 && r.orate2 != null) ? (r.orate2 / r.orate1 - 1) * 100 : null;
    const a = (r.arppu1 && r.arppu2 != null) ? (r.arppu2 / r.arppu1 - 1) * 100 : null;
    if (o == null || a == null) return { o, a, tag: '样本不足', tone: 'flat' };
    if (o > -10 && a > 0) return { o, a, tag: '✅ 无损伤', tone: 'up' };
    if (o <= -10 && a >= 0) return { o, a, tag: '转化伤、客单稳', tone: 'flat' };
    if (o <= -10 && a <= -10) return a <= o * 1.8 ? { o, a, tag: '客单崩', tone: 'down' } : { o, a, tag: '双杀', tone: 'down' };
    if (o > -10 && a <= -15) return { o, a, tag: '客单崩', tone: 'down' };
    return { o, a, tag: '观察', tone: 'flat' };
  };
  const diagRows = (DATA.diagU || []).filter(r => r.orate2 != null)
    .map(r => Object.assign({ c: r.c, win2: r.win2 }, diagOf(r)))
    .sort((a, b) => (a.o ?? 0) - (b.o ?? 0));
  let dtr = '<thead><tr><th>国家</th><th>后窗</th><th>下单率 Δ%</th><th>ARPPU Δ%</th><th>诊断</th></tr></thead><tbody>';
  diagRows.forEach(r => {
    dtr += `<tr style="cursor:default"><td>${r.c}</td>
      <td style="font-size:11px;color:var(--fg-tertiary)">${r.win2 || ''}</td>
      <td class="${cls(r.o)}">${r.o != null ? pct(r.o, 0) : '-'}</td>
      <td class="${cls(r.a)}">${r.a != null ? pct(r.a, 0) : '-'}</td>
      <td class="${r.tone}" style="font-weight:600">${r.tag}</td></tr>`;
  });
  $('#diagUTable').innerHTML = dtr + '</tbody>';
  const pRows = DATA.country.filter(r => r.c !== 'ALL' && !r.ht && r.pt === '已付费用户' && r.arpu1 && r.arpu2 != null)
    .map(r => ({ c: r.c, chg: (r.arpu2 / r.arpu1 - 1) * 100 }));
  const pGood = pRows.filter(r => r.chg >= 0).sort((a, b) => b.chg - a.chg);
  const pBad = pRows.filter(r => r.chg < 0).sort((a, b) => a.chg - b.chg);
  $('#diagPNote').innerHTML = `<b>表现好（ARPU 涨）</b>：${pGood.length ? pGood.map(r => `${r.c} ${pct(r.chg, 0)}`).join('、') : '—'}<br><b>表现差（ARPU 跌）</b>：${pBad.length ? pBad.map(r => `${r.c} ${pct(r.chg, 0)}`).join('、') : '—'}`;
  // 新未付费策略专项 v4（mentor口径：撤B窗直接AC对比 + LTV1/7/14/21，固定未付费盘，不随人群开关）
  const swRows = DATA.swap || [];
  const dgCls = { up: 'dg dg-up', flat: 'dg dg-flat', down: 'dg dg-down' };
  const c2 = (r, k, pre, suf, dec) => {
    const g = t => t != null ? pre + fmt(t, dec) + suf : '—';
    return `<td style="color:var(--fg-secondary)">${g(r[k + 'A'])}</td><td><b>${g(r[k + 'C'])}</b></td>`;
  };
  const swMets = [['付费率%', 'payr', '', '', 3], ['下单率%', 'orate', '', '', 3], ['付费uv', 'payuv', '', '', 1], ['ARPPU', 'arppu', '$', '', 1], ['ARPU', 'arpu', '$', '', 4], ['日均IAP$', 'iap', '', '', 0], ['LTV1', 'ltv1', '$', '', 3], ['LTV7', 'ltv7', '$', '', 3], ['LTV14', 'ltv14', '$', '', 3], ['LTV21', 'ltv21', '$', '', 3]];
  let swtr = `<thead><tr><th rowspan="2">国家</th>${swMets.map(m => `<th colspan="2">${m[0]}</th>`).join('')}<th rowspan="2">Δpp<br>(C−A)</th><th rowspan="2">诊断</th></tr>
    <tr>${swMets.map(() => '<th title="一期基线">A</th><th title="新策略">C</th>').join('')}</tr></thead><tbody>`;
  swRows.forEach(r => {
    const rowStyle = r.total ? ' class="tr-hl" style="font-weight:600"' : ' style="cursor:default"';
    swtr += `<tr${rowStyle}>
      <td>${r.c}${r.sw ? `<br><span style="font-size:11px;color:var(--fg-tertiary)">${r.sw} 切换</span>` : ''}</td>
      ${swMets.map(m => c2(r, m[1], m[2], m[3], m[4])).join('')}
      <td class="${cls(r.dpp)}" style="font-weight:600">${pp(r.dpp)}</td>
      <td><span class="${dgCls[r.tone] || dgCls.flat}">${r.diag || '—'}</span>${r.quals ? `<br><span style="font-size:11px;color:var(--fg-secondary)">${r.quals}</span>` : ''}</td></tr>`;
  });
  $('#swapTable').innerHTML = swtr + '</tbody>';
  const nR = swRows.filter(r => r.tone === 'up' && !r.total).length;
  const nF = swRows.filter(r => r.tone === 'down' && !r.total).length;
  $('#swapSummary').innerHTML = `<b>${nR}</b> 收复 · <b>${nF}</b> 未收复`;
  // 收入结构：金币 vs 订阅（11国+ALL × 全部/未付费/已付费 + 韩泰"全部"，全粒度静态表）
  const ptOrd = { '全部': 0, '未付费用户': 1, '已付费用户': 2 };
  const ptShort = { '全部': '全部', '未付费用户': '未付费', '已付费用户': '已付费' };
  // 跟随人群开关过滤; 韩泰仅"全部"口径(分人群行缺 8.17~8.25 聚合段, 拆开不全)
  const coinRows = DATA.country.filter(r => r.coinr2 != null && r.pt === curCPt && (!r.ht || curCPt === '全部'))
    .sort((a, b) => (a.c === 'ALL' ? -1 : b.c === 'ALL' ? 1 : b.coinr2 - a.coinr2));
  let ctr = '<thead><tr><th>国家</th><th>人群</th><th>金币占比 一期</th><th>金币占比 二期</th><th>Δpp</th><th>预警</th></tr></thead><tbody>';
  coinRows.forEach(r => {
    const dpp = r.coinr1 != null ? r.coinr2 - r.coinr1 : null;
    const warn = r.coinr2 > 35;
    ctr += `<tr class="${warn ? 'tr-warn' : ''}" style="cursor:default">
      <td>${r.c}${r.ht ? '<span style="font-size:11px;color:#94a3b8">·韩泰口径</span>' : ''}</td>
      <td>${ptShort[r.pt] || r.pt}</td>
      <td>${r.coinr1 != null ? fmt(r.coinr1, 1) + '%' : '—'}</td>
      <td style="${warn ? 'color:#dc2626;font-weight:600' : r.coinr2 > 30 ? 'color:#d97706;font-weight:600' : ''}">${fmt(r.coinr2, 1)}%</td>
      <td class="${cls(dpp != null ? -dpp : null)}">${pp(dpp)}</td>
      <td>${warn ? '<span style="color:#dc2626;font-weight:600">⚠️ 超35%</span>' : '<span style="color:#16a34a">✓</span>'}</td></tr>`;
  });
  $('#coinTable').innerHTML = ctr + '</tbody>';
  // 逐级漏斗（mentor 口径）
  const frows = (DATA.funnel || []).filter(r => r.pt === curCPt);
  const fcell = (a, b) => {
    if (a == null && b == null) return '<td>-</td>';
    if (a == null) return `<td>—→${fmt(b, 2)}%</td>`;
    if (b == null) return `<td>${fmt(a, 2)}%→—</td>`;
    const d = b - a;
    return `<td>${fmt(a, 2)}%→${fmt(b, 2)}%<br><span class="${cls(d)}" style="font-size:11px">${pp(d)}</span></td>`;
  };
  let ftr = '<thead><tr><th>国家</th><th>播放率<br><span style="font-weight:400;font-size:11px">观看/DAU</span></th><th>付费集触达率<br><span style="font-weight:400;font-size:11px">触达/观看</span></th><th>订单转化率<br><span style="font-weight:400;font-size:11px">建单/触达</span></th><th>支付完成率<br><span style="font-weight:400;font-size:11px">充值/建单</span></th><th>链条量（前→后）</th></tr></thead><tbody>';
  const fsort = (a, b) => (a.c === 'ALL' ? -1 : b.c === 'ALL' ? 1 : (b.dau2 || 0) - (a.dau2 || 0));
  frows.sort(fsort).forEach(r => {
    const chain = (t) => r['dau' + t] != null ? `${fmt(r['dau' + t] / 10000, 1)}万→${fmt(r['watch' + t] / 10000, 1)}万→${fmt(r['reach' + t] / 10000, 1)}万→${fmt(r['order' + t])}→${fmt(r['pay' + t])}` : '—';
    ftr += `<tr${r.c === 'ALL' ? ' class="tr-hl" style="font-weight:600"' : ''}><td>${r.c}${r.ht ? '<span style="font-size:11px;color:#94a3b8">·韩泰口径</span>' : ''}</td>
      ${fcell(r.play1, r.play2)}${fcell(r.touch1, r.touch2)}${fcell(r.ocr1, r.ocr2)}${fcell(r.psr1, r.psr2)}
      <td style="font-size:11px;color:#64748b">${chain('1')}<br>${chain('2')}</td></tr>`;
  });
  $('#fnTable').innerHTML = ftr + '</tbody>';
  // 韩泰单独口径表（前=一期前30天, 后=7.18上线后；前仅"全部"人群）
  const htRows = DATA.country.filter(r => r.ht && r.pt === curCPt);
  if (!DATA.country.some(r => r.ht)) {
    // 9.2 全切新口径: 韩泰无新口径数据, 表格位置换待补提示
    $('#htWrap').innerHTML = '<div style="padding:14px;font-size:13px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px">韩泰暂无"历史是否付费"新口径数据（9.1 导出仅含 11 国）。补导出新维度监控明细（日期×国家×历史是否付费，覆盖 6.1 起）后本表自动恢复。</div>';
  } else {
  const g = v => v != null ? v : null;
  let htr = '<thead><tr><th>国家</th><th>DAU日均 前→后</th><th>付费率 前→后</th><th>Δpp</th><th>订阅率 前→后</th><th>下单率 前→后</th><th>ARPPU 前→后</th><th>ARPU 前→后</th><th>IAP日均 前→后</th><th>IAP变化</th></tr></thead><tbody>';
  htRows.forEach(r => {
    const dpp = (r.rate2 != null && r.rate1 != null) ? r.rate2 - r.rate1 : null;
    const iapChg = (r.iap1 && r.iap2 != null) ? (r.iap2 / r.iap1 - 1) * 100 : null;
    const f2 = (a, b, pre, suf) => (a != null && b != null) ? pre + fmt(a, 2) + suf + '→' + pre + fmt(b, 2) + suf : (b != null ? '—→' + pre + fmt(b, 2) + suf : '-');
    htr += `<tr style="cursor:default"><td>${r.c}</td>
      <td>${r.dau1 != null ? fmt(r.dau1) + '→' + fmt(r.dau2) : '—→' + fmt(r.dau2)}</td>
      <td>${r.rate1 != null ? fmt(r.rate1, 3) + '%→' : '—→'}${fmt(r.rate2, 3)}%</td>
      <td class="${cls(dpp)}">${pp(dpp)}</td>
      <td>${r.subr1 != null ? fmt(r.subr1, 3) + '%→' : '—→'}${fmt(r.subr2, 3)}%</td>
      ${orateTd(r)}
      <td>${r.arppu1 != null ? '$' + fmt(r.arppu1, 1) + '→' : '—→'}$${fmt(r.arppu2, 1)}</td>
      ${arpuTd(r)}
      <td>${r.iap1 != null ? '$' + fmt(r.iap1) + '→' : '—→'}$${fmt(r.iap2)}</td>
      <td class="${cls(iapChg)}">${pct(iapChg, 0)}</td></tr>`;
  });
  $('#htTable').innerHTML = htr + '</tbody>';
  }
  // LTV 曲线（ALL 均值）
  const a = cmet('ALL', curCPt);
  const LK = [['D0', 'ltv0'], ['D1', 'ltv1'], ['D7', 'ltv7'], ['D14', 'ltv14'], ['D30', 'ltv30']];
  lineChart($('#ctyLtvCurve'), LK.map(x => x[0]), [
    { name: '一期', color: '#94a3b8', values: LK.map(x => a[x[1] + '_1'] ?? null) },
    { name: '二期', color: '#2563eb', values: LK.map(x => a[x[1] + '_2'] ?? null) }],
    { rawLabels: true, yFmt: v => '$' + v.toFixed(3) });
}
function renderCtyTrend(c) {
  const ser = (DATA.countryDaily[c] || []);
  const labels = ser.map(r => r.d);
  // 韩国/泰国二期未上线, 不标二期事件；事件按该国过滤
  const evs = evFor([c]).filter(e => REFCTYS.includes(c) ? e.d <= DATA.meta.p1[1] : true);
  lineChart($('#ctyTrendIap'), labels, [{ name: 'IAP', color: '#2563eb', values: ser.map(r => r.rev) }],
    { events: evs, yFmt: v => '$' + fmt(v, 0) });
  lineChart($('#ctyTrendRate'), labels, [{ name: '付费率', color: '#16a34a', values: ser.map(r => r.dau > 0 ? r.pay / r.dau * 100 : null) }],
    { events: evs, yFmt: v => v.toFixed(2) + '%' });
}

// ---------- 更新数据 ----------
function showUpdate() {
  navTo(null);
  const files = (DATA.meta.files || []).map(f => `<li>${f}</li>`).join('');
  $('#app').innerHTML = `
  <div class="card"><h2>更新数据（3 步）</h2>
    <div style="font-size:14px;line-height:2.2;margin:8px 0 4px">
      <b>第 1 步</b>｜把数分给的新 xlsx 放进<b>本文件夹</b>（或 Downloads），文件名包含对应关键词即可，程序自动按修改时间取最新并校验表结构：<br>
      <span style="color:#6b7280;font-size:13px">
      · 策略曝光表：文件名含「SEO数据看板」且不含「商业化/DO/档位」— 四种透视都支持：<b>策略名版</b>（交叉表_纯官网数据看板，维度3=策略名）、<b>配置id国家版</b>（维度2=配置id、维度4=国家，自动用老文件 id→策略名映射回挂）、<b>商业化策略看板版</b>（维度2=策略名、维度3=用户类型、维度4=国家）和<b>交叉表12版</b>（维度2=用户类型、维度3=国家、维度4=策略名，即 8.14 起常态上传格式）；多文件按日期自动合并、新的覆盖旧的<br>
      · 国家整体表：文件名含「商业化看板」或「SEO数据看板」— 需含 官网监控明细数据，支持老版（首列=时间）和<b>国家透视版</b>（维度1=日期，维度2/维度3=国家/用户类型<b>两种顺序自适应</b>，含 ltv0~30 与观看uv/触达付费集uv 时可展示逐级漏斗）；<b>多文件自动拼接</b>（如 6.1~7.16 一段 + 7.17~至今一段），导出被截断（"只能导出前N行"）的文件自动剔除其最大残缺日后并入<br>
      · 档位表：三种格式都支持，多文件按(国家,日期,付费状态)自动去重合并、新文件优先：<b>交叉表13四维版</b>（维度2=订单类型、维度3=国家、维度4=档位）、<b>交叉表13五维版</b>（维度2=档位名、维度3=档位价、维度4=订单类型、维度5=国家，即 8.14 起"档位2"格式）、老版「分档位数据」文件（sku_price / order_type / pay_user_type 列）；<b>文件名含「未付费」/「已付费」即按该付费状态归集</b>，不含则视为全部口径<br>
      · 支付表：文件名含「各配置id」— 需含 创建订单uv / paychannel_name / good_shelf_name 列</span><br>
      <b>第 2 步</b>｜双击本文件夹里的 <b>更新面板数据.bat</b>（自动重算 + 重新生成页面）<br>
      <b>第 3 步</b>｜回到本页面按 <b>F5</b> 刷新
    </div>
  </div>
  <div class="card"><h2>当前使用的数据文件</h2>
    <div class="hint">生成时间：${DATA.meta.gen || '-'}</div>
    <ul style="font-size:13px;line-height:2;color:#374151">${files}</ul>
    <div class="footer-note">若某文件拉了新版本但面板没变化：检查该文件表结构是否符合上方要求（不符合的文件会被自动跳过，改用上一个合规版本）。策略数据 = 策略名版（全历史）+ 配置id国家版（最近几天）自动合并。</div>
  </div>`;
}

// ---------- 初始化 ----------
(function init() {
  const sel = $('#stratSel');
  DATA.strategies.forEach(s => {
    const o = document.createElement('option');
    o.value = s.name; o.textContent = s.name;
    sel.appendChild(o);
  });
  showHome();
})();
</script>
</body>
</html>
